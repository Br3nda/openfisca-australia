[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools-scm"]

[project]
name = "openfisca-australia"
version = "0.0.1"
description = "OpenFisca Rules as Code model for Australia."
readme = "README.md"
keywords = [ "benefit", "microsimulation", "rac", "rules-as-code", "tax" ]
requires-python = ">=3.9"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "AGPL-3.0-or-later"
dependencies = [
    "openfisca-core[web-api]>=44.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9,<1",
    "yamllint>=1.35.1",
    "pre-commit>=4.3.0",
]

[tool.setuptools.packages.find]
include = ["openfisca_australia*"]

[tool.setuptools.package-data]
openfisca_australia = ["parameters/**/*.yaml", "situation_examples/*.json"]

[tool.ruff]
target-version = "py39"
lint.pydocstyle.convention = "google"

[tool.ruff.lint.isort]
known-first-party = [ "openfisca_australia" ]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--exitfirst --showlocals --doctest-modules --disable-warnings --import-mode importlib"
testpaths = [ "openfisca_australia/tests" ]
python_files = "**/*.py"
